name: hub_acc_prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-env: &app-env
  env_file: ${ENV_FILE:-.env.production}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env.production}
      POSTGRES_DB: hub_acc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub_acc"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: [tools]
    build: { context: ., target: app }
    <<: *app-env
    environment: &db-env
      NODE_ENV: production
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD}@postgres:5432/hub_acc
    working_dir: /repo/packages/db
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: app }
    restart: unless-stopped
    logging: *logging
    <<: *app-env
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: { context: ., target: app }
    restart: unless-stopped
    logging: *logging
    <<: *app-env
    environment: *db-env
    working_dir: /repo/apps/worker
    command: ["node_modules/.bin/tsx", "src/index.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # worker เขียนไฟล์นี้ทุกนาที ถ้าไฟล์เก่าเกิน 3 นาทีแปลว่างานหยุดเดิน
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/hub-worker-heartbeat) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    logging: *logging
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?ตั้ง DOMAIN ใน .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: hub
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: hub_acc
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./deploy/backup.sh:/usr/local/bin/hub-backup:ro
      - ./deploy/backup-loop.sh:/usr/local/bin/hub-backup-loop:ro
    entrypoint: ["sh", "/usr/local/bin/hub-backup-loop"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
