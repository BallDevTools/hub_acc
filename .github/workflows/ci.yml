name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub_ci_password
          POSTGRES_DB: hub_acc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub_acc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hub:hub_ci_password@127.0.0.1:5432/hub_acc
      TEST_DATABASE_URL: postgresql://hub:hub_ci_password@127.0.0.1:5432/hub_acc_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
